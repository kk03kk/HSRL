[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsai"
version = "1.0.0"
description = "Hearthstone Battlegrounds AlphaZero project on the AutoTavern TavernGym engine (37.0.2.256589): imperfect-information MCTS + self-play + PPO"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
train = ["torch>=2.0", "matplotlib>=3.5"]
dev = ["pytest>=7.0", "scipy>=1.10"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hsbg*", "workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
