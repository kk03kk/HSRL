<!doctype html><html lang="zh"><meta charset="utf-8"><title>AutoTavern 离线回放</title>
<style>body{font:16px system-ui;background:#101827;color:#e5edf8;margin:24px}button,input,select{font:inherit;padding:7px;margin:5px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c293b;padding:16px;border-radius:8px}#error{color:#ff9d9d}small{color:#a8bfd7}</style>
<h1>AutoTavern 离线决策回放</h1><p>导入 JSONL；文件只在本页内存读取。显示玩家自己的局面及公开计分板，不展示全局重放状态。</p>
<input type="file" id="file" accept=".jsonl"><button id="prev">上一步</button><button id="next">下一步</button><select id="turn"><option>回合跳转</option></select><input id="index" type="number" min="0" value="0"><button id="go">跳转</button><button id="note">导出局面批注</button>
<label><input type="checkbox" id="raw">查看完整玩家字段</label><p id="error"></p><p id="meta"></p><main><section><h2>动作前 · 玩家可见</h2><pre id="before"></pre></section><section><h2>动作后 · 玩家可见</h2><pre id="after"></pre></section></main><h2>策略与执行</h2><pre id="policy"></pre><small>bot 或旧快照未记录策略概率时显示 null。延期动作不计有效决策。批注不自动进入训练集。</small>
<script>
'use strict';let ds=[],header={},cursor=0;const el=id=>document.getElementById(id),show=(id,x)=>el(id).textContent=JSON.stringify(x,null,2);
function brief(v){if(el('raw').checked)return v;const m=v.me,card=c=>({name:c.name_zh||c.name||c.id,attack:c.atk,health:c.hp,tier:c.tier,golden:c.golden,keywords:c.keywords});return {turn:v.turn,phase:v.phase,hero:m.hero?.name_zh||m.hero?.name,gold:m.gold,tier:m.tier,health:m.health,armor:m.armor,board:m.board.map(card),hand:m.hand.map(card),shop:m.shop.map(card),pending:m.pending,opponents:v.opponents};}
function render(){if(!ds.length)return;cursor=Math.max(0,Math.min(ds.length-1,cursor));const d=ds[cursor];el('index').value=cursor;el('meta').textContent=`决策 ${cursor+1}/${ds.length} · 大厅 ${d.lobby} · 席位 ${d.seat} · 回合 ${d.turn}`;show('before',brief(d.before));show('after',brief(d.after));show('policy',{action:d.action,semantic:d.semantic,applied:d.applied,memory_reset:d.memory_reset,value:d.value,logp:d.logp,entropy:d.entropy,topk:d.topk,legal:d.observation.mask.flatMap((x,i)=>x?[i]:[])});}
el('file').onchange=async e=>{try{const rows=(await e.target.files[0].text()).trim().split(/\r?\n/).map(JSON.parse);if(rows[0].format!=='taverngym.trace.v1'||rows.at(-1).type!=='summary')throw Error('不完整或不支持的轨迹');header=rows[0];ds=rows.slice(1,-1).flatMap(r=>r.decisions||[]);cursor=0;el('turn').replaceChildren();const seen=new Set();ds.forEach((d,i)=>{const key=`${d.lobby}/${d.seat}/${d.turn}`;if(!seen.has(key)){seen.add(key);const o=document.createElement('option');o.value=i;o.textContent=key;el('turn').append(o);}});el('error').textContent='';render();}catch(x){el('error').textContent=String(x);}};
el('prev').onclick=()=>{cursor--;render();};el('next').onclick=()=>{cursor++;render();};el('go').onclick=()=>{cursor=Number(el('index').value)||0;render();};el('turn').onchange=e=>{cursor=Number(e.target.value);render();};
el('raw').onchange=render;
el('note').onclick=()=>{if(!ds.length)return;const d=ds[cursor],a=document.createElement('a');const value={format:'taverngym.annotation.v1',identity:header.identity,seed:header.seed,lobby:d.lobby,seat:d.seat,decision:d.decision,turn:d.turn,observation:d.observation,action:d.action,recommended_action:null,acceptable_actions:[],reason:'',training_approved:false};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.href=url;a.download='annotation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
