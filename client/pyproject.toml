[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hsai-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python>=4.8", "torch>=2.0"]
[project.optional-dependencies]
live = ["rapidocr", "onnxruntime"]
[tool.setuptools.packages.find]
where = ["."]
include = ["bg_agent*", "legacy_policy*", "hsrl_agent*"]
[tool.setuptools.package-data]
bg_agent = ["data/**/*.json", "data/**/*.png"]
legacy_policy = ["data/*.json"]

hsrl_agent = ["data/*.json", "live/data/*.json"]
